<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sergei Kolesnik</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 0 0 20px 20px; 
            padding: 0 0 30px 0;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            border-top: none;
            overflow: hidden;
        }
        .cover-photo {
            width: 100%;
            height: 250px;
            object-fit: cover; 
            object-position: left center;
            display: block;
            margin-bottom: 20px;
        }
        .content-padding {
            padding: 0 30px;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0 5px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .position {
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 5px;
            font-style: italic;
        }
        .company {
            color: #d4af37;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .contact-links a {
            color: #ffffff;
            text-decoration: none;
            background-color: #2c2c2c;
            padding: 12px;
            border-radius: 10px;
            transition: background-color 0.3s;
            font-size: 14px;
        }
        .contact-links a:hover {
            background-color: #d4af37;
            color: #121212;
        }
        .save-btn {
            background-color: #d4af37;
            color: #121212;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.3s;
        }
        .save-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="photo.jpg" alt="Sergei Kolesnik" class="cover-photo">
        
        <div class="content-padding">
            <h1>SERGEI KOLESNIK</h1>
            <div class="position">CEO</div>
            <div class="company">HORECA SOLUTIONS OU</div>
            
            <div class="contact-links">
                <a href="tel:+37251905766">📞 +372 5190 5766</a>
                <a href="mailto:sergei@horecasolutions.eu">✉️ sergei@horecasolutions.eu</a>
                <a href="https://wa.me/37251905766" target="_blank">💬 WhatsApp</a>
                <a href="https://www.horecasolutions.eu" target="_blank">🌐 www.horecasolutions.eu</a>
                <a href="https://maps.google.com/?q=Tallinn, Estonia" target="_blank">📍 Tallinn, Estonia</a>
            </div>
            
            <button class="save-btn" onclick="saveContact()">Сохранить контакт</button>
        </div>
    </div>

    <script>
        function saveContact() {
            const vcard = `BEGIN:VCARD
VERSION:3.0
FN:SERGEI KOLESNIK
ORG:HORECA SOLUTIONS OU
TITLE:CEO
TEL;TYPE=CELL:+37251905766
EMAIL:sergei@horecasolutions.eu
URL:https://www.horecasolutions.eu
ADR;TYPE=WORK:;;;Tallinn;;;Estonia
END:VCARD`;

            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Sergei_Kolesnik.vcf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
