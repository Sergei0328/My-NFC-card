<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровая визитка</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            /* Верхние углы прямые, так как там фото на всю ширину */
            border-radius: 0 0 20px 20px; 
            padding: 0 0 30px 0; /* Убрали отступ сверху */
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            border-top: none;
            overflow: hidden; /* Чтобы фото не вылезало за края */
        }
        
        /* --- ФОТО НА ВСЮ ШИРИНУ --- */
        .cover-photo {
            width: 100%;
            height: 250px; /* Высота фото. Можете изменить на 200px или 300px */
            object-fit: cover; /* Заполняет всю область без искажений */
            display: block;
            margin-bottom: 20px;
        }
        /* --------------------------------- */
        
        /* Отступы для текста внутри карточки */
        .content-padding {
            padding: 0 30px;
        }

        h1 {
            font-size: 24px;
            margin: 10px 0 5px;
            font-weight: 600;
        }
        .position {
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 5px;
            font-style: italic;
        }
        .company {
            color: #d4af37;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .contact-links a {
            color: #ffffff;
            text-decoration: none;
            background-color: #2c2c2c;
            padding: 12px;
            border-radius: 10px;
            transition: background-color 0.3s;
            font-size: 14px;
        }
        .contact-links a:hover {
            background-color: #d4af37;
            color: #121212;
        }
        .save-btn {
            background-color: #d4af37;
            color: #121212;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.3s;
        }
        .save-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ФОТО НА ВСЮ ШИРИНУ -->
        <img src="photo.jpg" alt="Фото" class="cover-photo">
        
        <div class="content-padding">
            <!-- ЗАМЕНИТЕ ИМЯ, ДОЛЖНОСТЬ И КОМПАНИЮ ЗДЕСЬ -->
            <h1>Иван Иванов</h1>
            <div class="position">Менеджер по продажам</div>
            <div class="company">ООО "Ромашка"</div>
            
            <div class="contact-links">
                <!-- ЗАМЕНИТЕ НОМЕРА, ПОЧТУ И ССЫЛКИ ЗДЕСЬ -->
                <a href="tel:+37255555555">📞 +372 5555 5555</a>
                <a href="mailto:friend@example.com">✉️ friend@example.com</a>
                <a href="https://wa.me/37255555555" target="_blank">💬 WhatsApp</a>
                <a href="https://www.example.com" target="_blank">🌐 www.example.com</a>
                <a href="https://maps.google.com/?q=Таллинн" target="_blank">📍 г. Таллинн, ул. Примерная, 1</a>
            </div>
            
            <button class="save-btn" onclick="saveContact()">Сохранить контакт</button>
        </div>
    </div>

    <script>
        // ЗАМЕНИТЕ ЭТИ ДАННЫЕ НА ДАННЫЕ ДРУГА (для кнопки скачивания)
        function saveContact() {
            const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Иван Иванов
ORG:ООО "Ромашка"
TITLE:Менеджер по продажам
TEL;TYPE=CELL:+37255555555
EMAIL:friend@example.com
URL:https://www.example.com
ADR;TYPE=WORK:;;ул. Примерная, 1;Таллинн;;;Эстония
END:VCARD`;

            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "contact.vcf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
